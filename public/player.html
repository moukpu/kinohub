<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinoHub Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="cinemaFrame" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get('url');
    if (src) {
      document.getElementById('cinemaFrame').src = decodeURIComponent(src);
    }
  </script>
</body>
</html>
